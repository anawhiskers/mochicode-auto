name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run focused unit tests
        shell: pwsh
        run: |
          python -m unittest tests.test_routing tests.test_adaptive_config tests.test_agent_adapter tests.test_capabilities
          python -m unittest tests.test_package.PackageTests.test_portable_python_launchers_select_one_executable
      - name: Parse PowerShell entry points
        shell: pwsh
        run: |
          $files = @(
            'install.ps1',
            'restore.ps1',
            'package.ps1',
            'verify-package.ps1',
            'portable/install/agent-sync.ps1',
            'portable/install/doctor.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "$file failed PowerShell parsing: $($errors.Message -join '; ')"
            }
          }
