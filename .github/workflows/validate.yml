name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run full unit suite
        shell: pwsh
        run: python -m unittest discover -s tests -v

  package-and-powershell:
    name: Package and PowerShell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run package security suite
        shell: pwsh
        run: python -m unittest tests.test_package -v
      - name: Parse every PowerShell file
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath . -Recurse -File -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "$($_.FullName) failed PowerShell parsing: $($errors.Message -join '; ')"
            }
          }
