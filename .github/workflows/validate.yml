name: Validate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NO_COLOR: "1"
  TERM: dumb

jobs:
  python-tests:
    name: Python 3.13 / ${{ matrix.group }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        group: [core, execution, installer, controller]
        include:
          - group: core
            modules: tests.test_adaptive_config tests.test_agent_adapter tests.test_capabilities tests.test_chatgpt_assets tests.test_child_receipts tests.test_cli_platform tests.test_cli_smoke tests.test_config_and_backend tests.test_contracts tests.test_gitops tests.test_learning tests.test_manager_state tests.test_output_schemas tests.test_package tests.test_process_safety tests.test_role_catalog tests.test_routing tests.test_scheduler tests.test_skill_dispositions tests.test_state_and_evidence
          - group: execution
            modules: tests.test_backend_invocation tests.test_cli_commands tests.test_codex_provider tests.test_verification
          - group: installer
            modules: tests.test_installer tests.test_installer_adaptive
          - group: controller
            modules: tests.test_stub_demo tests.test_terra_contract_quality
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install tested Codex CLI
        shell: pwsh
        run: |
          npm install --global @openai/codex@0.144.0
          python -m pip install jsonschema==4.26.0
      - name: Run full unit suite
        shell: pwsh
        run: python -m unittest ${{ matrix.modules }} -v

  python-floor:
    name: Python 3.11 minimum refusal
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify unsupported runtime fails doctor
        shell: pwsh
        run: python -c "from scripts.mochicode_core.cli import doctor; check=next(item for item in doctor()['checks'] if item['name']=='python'); assert check['ok'] is False, check"

  python-suites:
    name: Python suites
    if: ${{ always() }}
    needs: [python-tests, python-floor]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Python 3.13 shard and the Python 3.11 floor check
        shell: bash
        run: test '${{ needs.python-tests.result }}' = 'success' && test '${{ needs.python-floor.result }}' = 'success'

  package-and-powershell:
    name: Package and PowerShell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install tested Codex CLI
        shell: pwsh
        run: npm install --global @openai/codex@0.144.0
      - name: Run package security suite
        shell: pwsh
        run: python -m unittest tests.test_package -v
      - name: Parse every PowerShell file
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath . -Recurse -File -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "$($_.FullName) failed PowerShell parsing: $($errors.Message -join '; ')"
            }
          }
