name: Build attested release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate-tag:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  build-attest-release:
    needs: validate-tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build verified portable ZIP
        id: package
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $bundle = Join-Path $env:RUNNER_TEMP "MochiCode-Auto-$version"
          $archive = Join-Path $env:RUNNER_TEMP "MochiCode-Auto-$version.zip"
          ./package.ps1 -Destination $bundle -ZipPath $archive -Version $version
          ./verify-package.ps1 -ZipPath $archive -Quiet
          "archive=$archive" >> $env:GITHUB_OUTPUT
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.package.outputs.archive }}
      - name: Create release and upload attested ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = '${{ steps.package.outputs.archive }}'
          gh release create '${{ github.ref_name }}' $archive --verify-tag --generate-notes
